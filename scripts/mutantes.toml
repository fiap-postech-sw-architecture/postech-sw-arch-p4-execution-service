# Mutantes manuais dos modulos criticos (scripts/mutacao_manual.py, make mutacao).
#
# Cada [[mutante]] troca o trecho `de` (uma ocorrencia exata no arquivo) por
# `para` e roda so os testes do grupo `testes`; o teste esperado e o que deveria
# pegar o defeito. `equivalente` marca o mutante que nao muda o comportamento:
# se sobreviver, nao conta contra a suite.

[config]
# O que o script copia do repositorio para mutants/ (arquivos e pastas): tudo
# que os testes dos grupos abaixo importam ou leem. Os de integracao aplicam as
# migracoes do Alembic (alembic.ini e migrations/, lidos a partir da raiz da
# copia) num PostgreSQL do testcontainers, e os de mensageria sobem tambem o
# RabbitMQ com a topologia de contratos/rabbitmq; com TEST_DATABASE_URL
# apontando para um banco *_test no ar, poupam o container do PostgreSQL.
copiar = ["src", "tests", "contratos", "migrations", "alembic.ini", "pyproject.toml"]

[testes]
execucao = ["tests/unitarios/execucao/test_execucao.py", "tests/unitarios/test_maquinas_de_estado.py", "tests/unitarios/execucao/test_use_cases_execucao.py"]
diagnostico = ["tests/unitarios/diagnostico/test_dominio_diagnostico.py", "tests/unitarios/test_maquinas_de_estado.py", "tests/unitarios/diagnostico/test_use_cases_diagnostico.py"]
estoque = ["tests/unitarios/estoque/test_dominio_estoque.py", "tests/unitarios/estoque/test_services.py", "tests/unitarios/test_maquinas_de_estado.py", "tests/unitarios/estoque/test_use_cases_estoque.py"]
saga = ["tests/unitarios/execucao/test_use_cases_execucao.py", "tests/unitarios/estoque/test_use_cases_estoque.py", "tests/unitarios/diagnostico/test_use_cases_diagnostico.py"]
idempotencia = ["tests/unitarios/compartilhado/test_idempotencia.py", "tests/unitarios/compartilhado/test_database.py"]
concorrencia = ["tests/integracao/test_concorrencia.py"]
veiculo = ["tests/unitarios/compartilhado/test_veiculo.py"]
jwt = ["tests/unitarios/compartilhado/test_autenticacao.py", "tests/unitarios/compartilhado/test_jwks.py"]
consumidor = ["tests/unitarios/compartilhado/test_mensageria.py", "tests/integracao/test_mensageria.py"]
relay = ["tests/unitarios/compartilhado/test_relay.py", "tests/integracao/test_relay.py"]


