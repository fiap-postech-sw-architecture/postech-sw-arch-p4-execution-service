# Consumidor dos comandos da saga (python -m src.consumidor), /metrics na 9100.
# Uma mensagem em voo por vez, uma replica fixa. Sondas pelos arquivos em /tmp,
# como no relay (relay.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service-consumidor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: execution-service-consumidor
  template:
    metadata:
      labels:
        app: execution-service-consumidor
        processo: consumidor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      # SIGTERM termina a mensagem em curso e fecha as conexoes.
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Espera o Job de migracao da mesma versao (api.yaml).
        - name: aguarda-migracao
          image: pytstop-execution-service
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              h="$(alembic heads | cut -d' ' -f1)" && [ -n "$h" ]
              && until [ "$(alembic current 2>/dev/null | cut -d' ' -f1)" = "$h" ];
              do sleep 2; done
          env:
            - name: POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: execucao-postgres
                  key: POSTGRES_APP_PASSWORD
            - name: DATABASE_URL
              value: postgresql://execucao_app:$(POSTGRES_APP_PASSWORD)@execucao-postgres.pytstop-execucao.svc.cluster.local:5432/execucao
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: consumidor
          image: pytstop-execution-service
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.consumidor"]
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: execution-service
          env:
            - name: POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: execucao-postgres
                  key: POSTGRES_APP_PASSWORD
            - name: DATABASE_URL
              value: postgresql://execucao_app:$(POSTGRES_APP_PASSWORD)@execucao-postgres.pytstop-execucao.svc.cluster.local:5432/execucao
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: RABBITMQ_URL
          # Startup pelo heartbeat, e nao pelo pronto (relay.yaml).
          startupProbe:
            exec:
              command: ["test", "-f", "/tmp/consumidor-heartbeat"]
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - import os,sys,time;sys.exit(time.time()-os.path.getmtime('/tmp/consumidor-heartbeat')>90)
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/consumidor-pronto"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
