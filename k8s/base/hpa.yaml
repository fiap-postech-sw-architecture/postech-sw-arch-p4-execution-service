# Autoescalonamento da API por CPU (70% do request), so na API: relay e
# consumidor ficam em uma replica. Teto por overlay (ADR-042): 2 no kind, 1 no
# kind-ci (o runner do CD com os tres servicos), 3 no k3s. Precisa do
# metrics-server, que o overlay kind do platform instala e o k3s ja traz.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: execution-service-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: execution-service-api
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
